# SubTunnel VPS (tunnel.subtunnel.dev, 34.255.144.232): serve aiandtech.news
# from the Mac mini's standby site. Put in /etc/nginx/sites-enabled/ (or the
# http {} block), then: sudo nginx -t && sudo systemctl reload nginx
# Certificate: see README.md, "TLS certificate".

server {
    listen 80;
    server_name aiandtech.news www.aiandtech.news;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.aiandtech.news$request_uri; }
}

server {
    listen 443 ssl;
    server_name aiandtech.news;
    ssl_certificate     /etc/letsencrypt/live/aiandtech.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiandtech.news/privkey.pem;
    return 301 https://www.aiandtech.news$request_uri;
}

server {
    listen 443 ssl;
    server_name www.aiandtech.news;
    ssl_certificate     /etc/letsencrypt/live/aiandtech.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiandtech.news/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # SubTunnel routes by Host: hand it the tunnel's subdomain.
        proxy_set_header Host aitn-web.subtunnel.dev;
        proxy_set_header X-Forwarded-Host www.aiandtech.news;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
